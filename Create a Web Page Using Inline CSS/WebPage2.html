<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Example</title>
</head>
<body style="background-color: #f0f8ff; font-family: Arial;">
    <h1 style="color: darkblue; text-align: center;">
        Welcome to My Web Page
    </h1>
    <p style="font-size: 18px; color: green; text-align: center;">
        This webpage is designed using Inline CSS.</p>
    <div style="
        width: 300px;
        margin: auto;
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 2px 2px 10px gray;
        text-align: center;
    ">
        <h2 style="color: red;">About Us</h2>
        <p style="color: #444;">
            Inline CSS is used to apply style directly
            inside HTML tags.
        </p>
        <button style="
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        ">
            Click Here
        </button>
    </div>
</body>
</html>
