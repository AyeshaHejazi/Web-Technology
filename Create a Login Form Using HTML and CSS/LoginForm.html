<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
    <style>
        body{
            font-family: Arial;
            background-color: #f2f2f2;
        }
        .login-box{
            width: 300px;
            background-color: white;
            margin: 100px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px gray;
        }
        h2{
            text-align: center;
            color: darkblue;
        }
        input[type="text"],
        input[type="password"]{
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
        }
        input[type="submit"]{
            width: 100%;
            padding: 10px;
            background-color: darkblue;
            color: white;
            border: none;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>User Login</h2>
    <form>
        <label>Username</label>
        <input type="text" placeholder="Enter Username">

        <label>Password</label>
        <input type="password" placeholder="Enter Password">

        <input type="submit" value="Login">
    </form>
</div>
</body>
</html>
